# Underfloor heating controller
# Board: Waveshare ESP32-S3-POE-ETH-8DI-8RO (ESP32-S3-WROOM-1U-N16R8)
# See README.md for the pin map and wiring.

substitutions:
  name: ufh-controller
  friendly_name: UFH Controller
  # Servo bus. SCS servos ship at 1000000 baud; this servo was set to 115200 with tools/scs_tool.py
  # (more margin, and plenty fast for this job). A new servo needs the same change.
  servo_baud: "115200"
  servo_id: "1"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2025.11.0
  project:
    name: ifold-estate.ufh-controller
    version: "0.1.0"
  includes:
    - ufh_screen.h      # LCD heat-flow screen (preview it with tools/screen_preview/render.py)
    - mixer_control.h   # mixed-flow control and over-temperature cut-out (test: tools/mixer_sim)
  on_boot:
    priority: -100
    then:
      - lambda: |-
          // Every servo reading goes to the position tracker; moves stop when the positioner says so.
          id(mixer_servo).set_sample_callback([](int raw, int dir, float dt, bool driving) {
            auto &pz = mixer_control::positioner();
            auto &tr = pz.tracker();
            const float before = tr.x();
            tr.sample(raw, dir, dt, driving);
            pz.watch_calibration();
            // Movement the servo didn't cause (idle polls, dir 0): log it, as evidence of the valve
            // being pushed by the flow or turned by hand. The controller then drives it back.
            static float drift = 0;
            if (dir == 0 && tr.known()) {
              drift += tr.x() - before;
              if (std::fabs(drift) >= 40) {
                const auto &pc = mixer_control::pos_config();
                ESP_LOGW("mixer", "Valve moved by itself: %+.0f counts (%+.0f %% of the stroke), now %.0f %%", drift,
                         pc.stroke_x > 0 ? 100 * drift / pc.stroke_x : 0, pc.stroke_x > 0 ? pz.opening(pc) * 100 : 0);
                drift = 0;
              }
            } else {
              drift = 0;
            }
          });
          id(mixer_servo).set_stop_check([]() {
            return mixer_control::move_active() &&
                   mixer_control::positioner().should_stop(mixer_control::current_move(), mixer_control::pos_config());
          });

esp32:
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

external_components:
  - source:
      type: local
      path: components
    components: [scs_servo]

# Logs go to USB-C (USB Serial/JTAG), so UART0 (header Tx/Rx, GPIO43/44) is free for the servo.
logger:
  hardware_uart: USB_SERIAL_JTAG

api:
  # Don't reboot when HA is away: heating runs on the board, and a reboot drops every relay.
  reboot_timeout: 0s
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    encryption: {}   # reuses the API encryption key

web_server:
  port: 80
  version: 3
  auth:
    username: admin
    password: !secret web_password

# ---------------------------------------------------------------- Network (W5500 over SPI)
ethernet:
  type: W5500
  clk_pin: GPIO15
  mosi_pin: GPIO13
  miso_pin: GPIO14
  cs_pin: GPIO16
  interrupt_pin: GPIO12
  clock_speed: 25MHz

# ---------------------------------------------------------------- Buses
i2c:
  id: i2c_bus
  sda: GPIO42
  scl: GPIO41
  frequency: 100kHz

# Display SPI bus on the TF-card pins (no TF card is used). Separate from the W5500 bus.
spi:
  id: lcd_spi
  interface: SPI3
  clk_pin: GPIO48
  mosi_pin: GPIO47

uart:
  id: servo_uart
  # Header Tx/Rx (UART0). The boot ROM prints its start-up text here at 115200, but that can't form
  # a valid servo packet (no 0xFF bytes), so the servo ignores it.
  tx_pin: GPIO43
  rx_pin: GPIO44
  baud_rate: ${servo_baud}

one_wire:
  - platform: gpio
    pin: GPIO21

# ---------------------------------------------------------------- Relay expander (TCA9554 @ 0x20)
pca9554:
  - id: relay_expander
    address: 0x20

time:
  - platform: pcf85063
    id: rtc_time
  - platform: homeassistant
    id: ha_time
    on_time_sync:
      then:
        - pcf85063.write_time:
            id: rtc_time

# ---------------------------------------------------------------- Relays (all OFF at boot)
# Relay 1 boiler CFH, 2 floor circulation pump, 3 spare, 4-8 zone valves (zones not yet mapped).
switch:
  - platform: gpio
    id: relay1
    name: "Relay 1"
    restore_mode: ALWAYS_OFF
    pin: { pca9554: relay_expander, number: 0 }
  - platform: gpio
    id: relay2
    name: "Relay 2"
    restore_mode: ALWAYS_OFF
    pin: { pca9554: relay_expander, number: 1 }
  - platform: gpio
    id: relay3
    name: "Relay 3"
    restore_mode: ALWAYS_OFF
    pin: { pca9554: relay_expander, number: 2 }
  - platform: gpio
    id: relay4
    name: "Relay 4"
    restore_mode: ALWAYS_OFF
    pin: { pca9554: relay_expander, number: 3 }
  - platform: gpio
    id: relay5
    name: "Relay 5"
    restore_mode: ALWAYS_OFF
    pin: { pca9554: relay_expander, number: 4 }
  - platform: gpio
    id: relay6
    name: "Relay 6"
    restore_mode: ALWAYS_OFF
    pin: { pca9554: relay_expander, number: 5 }
  - platform: gpio
    id: relay7
    name: "Relay 7"
    restore_mode: ALWAYS_OFF
    pin: { pca9554: relay_expander, number: 6 }
  - platform: gpio
    id: relay8
    name: "Relay 8"
    restore_mode: ALWAYS_OFF
    pin: { pca9554: relay_expander, number: 7 }

  - platform: scs_servo
    name: "Mixer servo torque"
    restore_mode: ALWAYS_OFF
  # Automatic mixed-flow control. Off by default until the servo is mounted and its cold/hot
  # positions are set. The over-temperature cut-out works either way.
  - platform: template
    id: mixer_auto
    name: "Mixer auto"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - lambda: |-
          // The servo can't report the valve position (continuous mode through the gearbox), so find
          // it again by homing to cold, and start the controller from there.
          mixer_control::positioner().request_home();
          mixer_control::instance().set_opening(0);
          mixer_control::manual_target() = NAN;
  # Direction: on if positive drive turns the valve towards cold. Find it with the jog buttons.
  - platform: template
    id: mixer_reverse
    name: "Mixer reverse"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config

# ---------------------------------------------------------------- Mixer servo commissioning
# The servo runs in continuous (motor) mode through the old actuator's gearbox: set it once with
# "Servo motor mode". Jog to check direction (the logs show position during runs); then "Mixer
# calibrate": cold end (timed push), then hot end (stall seen by the position sensor), storing both.
button:
  - platform: template
    name: "Servo motor mode"
    entity_category: config
    on_press:
      - lambda: 'id(mixer_servo).set_motor_mode(true);'
  - platform: template
    name: "Servo position mode"
    entity_category: config
    on_press:
      - lambda: 'id(mixer_servo).set_motor_mode(false);'
  - platform: template
    name: "Mixer jog hot"
    entity_category: config
    on_press:
      - lambda: |-
          // The tracker follows the jog; in auto the controller will move back to its target.
          int duty = int(id(mixer_power).state * 10) * (id(mixer_reverse).state ? -1 : 1);
          id(mixer_servo).start_run(duty, 1000, duty * int(id(mixer_kick).state) / int(id(mixer_power).state), 200);
  - platform: template
    name: "Mixer jog cold"
    entity_category: config
    on_press:
      - lambda: |-
          // The tracker follows the jog; in auto the controller will move back to its target.
          int duty = -int(id(mixer_power).state * 10) * (id(mixer_reverse).state ? -1 : 1);
          id(mixer_servo).start_run(duty, 1000, duty * int(id(mixer_kick).state) / int(id(mixer_power).state), 200);
  - platform: template
    name: "Mixer calibrate"
    entity_category: config
    on_press:
      - lambda: 'mixer_control::positioner().request_calibration();'
  - platform: template
    name: "Mixer home"
    entity_category: config
    on_press:
      - lambda: 'mixer_control::positioner().request_home();'

# ---------------------------------------------------------------- Digital inputs (opto-isolated)
binary_sensor:
  - platform: gpio
    id: di1
    name: "Input 1"
    pin: { number: GPIO4, inverted: true, mode: { input: true, pullup: true } }
    filters: [delayed_on_off: 50ms]
  - platform: gpio
    id: di2
    name: "Input 2"
    pin: { number: GPIO5, inverted: true, mode: { input: true, pullup: true } }
    filters: [delayed_on_off: 50ms]
  - platform: gpio
    id: di3
    name: "Input 3"
    pin: { number: GPIO6, inverted: true, mode: { input: true, pullup: true } }
    filters: [delayed_on_off: 50ms]
  - platform: gpio
    id: di4
    name: "Input 4"
    pin: { number: GPIO7, inverted: true, mode: { input: true, pullup: true } }
    filters: [delayed_on_off: 50ms]
  - platform: gpio
    id: di5
    name: "Input 5"
    pin: { number: GPIO8, inverted: true, mode: { input: true, pullup: true } }
    filters: [delayed_on_off: 50ms]
    # Mixer gearbox cam switch: record where the shaft is when it changes (state is 50 ms late).
    on_state:
      - lambda: |-
          auto *sv = id(mixer_servo);
          auto &tr = mixer_control::positioner().tracker();
          ESP_LOGI("cam", "DI5 %s: raw %d x %.0f%s dir %+d t %u ms", x ? "ON " : "OFF", sv->last_position(), tr.x(),
                   tr.in_gap() ? " (gap)" : "", sv->run_direction(), (unsigned) sv->run_elapsed_ms());
  - platform: gpio
    id: di6
    name: "Input 6"
    pin: { number: GPIO9, inverted: true, mode: { input: true, pullup: true } }
    filters: [delayed_on_off: 50ms]
    # Mixer gearbox cam switch: record where the shaft is when it changes (state is 50 ms late).
    on_state:
      - lambda: |-
          auto *sv = id(mixer_servo);
          auto &tr = mixer_control::positioner().tracker();
          ESP_LOGI("cam", "DI6 %s: raw %d x %.0f%s dir %+d t %u ms", x ? "ON " : "OFF", sv->last_position(), tr.x(),
                   tr.in_gap() ? " (gap)" : "", sv->run_direction(), (unsigned) sv->run_elapsed_ms());
  - platform: gpio
    id: di7
    name: "Input 7"
    pin: { number: GPIO10, inverted: true, mode: { input: true, pullup: true } }
    filters: [delayed_on_off: 50ms]
    # Mixer gearbox cam switch: record where the shaft is when it changes (state is 50 ms late).
    on_state:
      - lambda: |-
          auto *sv = id(mixer_servo);
          auto &tr = mixer_control::positioner().tracker();
          ESP_LOGI("cam", "DI7 %s: raw %d x %.0f%s dir %+d t %u ms", x ? "ON " : "OFF", sv->last_position(), tr.x(),
                   tr.in_gap() ? " (gap)" : "", sv->run_direction(), (unsigned) sv->run_elapsed_ms());
  - platform: gpio
    id: di8
    name: "Input 8"
    pin: { number: GPIO11, inverted: true, mode: { input: true, pullup: true } }
    filters: [delayed_on_off: 50ms]
    # Mixer gearbox cam switch: record where the shaft is when it changes (state is 50 ms late).
    on_state:
      - lambda: |-
          auto *sv = id(mixer_servo);
          auto &tr = mixer_control::positioner().tracker();
          ESP_LOGI("cam", "DI8 %s: raw %d x %.0f%s dir %+d t %u ms", x ? "ON " : "OFF", sv->last_position(), tr.x(),
                   tr.in_gap() ? " (gap)" : "", sv->run_direction(), (unsigned) sv->run_elapsed_ms());

  - platform: status
    name: "Status"

# ---------------------------------------------------------------- Mixer servo (SC15 via Bus Servo Adapter A)
scs_servo:
  - id: mixer_servo
    uart_id: servo_uart
    servo_id: ${servo_id}
    update_interval: 2s
    position:
      id: mixer_position
      name: "Mixer servo position"
    load:
      id: mixer_load
      name: "Mixer servo load"
    voltage:
      name: "Mixer servo voltage"
    temperature:
      name: "Mixer servo temperature"
    current:
      name: "Mixer servo current"

number:
  - platform: scs_servo
    name: "Mixer servo target"
    mode: box
  # Mixer control settings (kept in flash)
  - platform: template
    id: mixed_setpoint
    name: "Mixed flow setpoint"
    unit_of_measurement: "°C"
    min_value: 20
    max_value: 50
    step: 0.5
    initial_value: 35
    optimistic: true
    restore_value: true
    mode: box
  - platform: template
    id: mixed_limit
    name: "Mixed flow limit"
    unit_of_measurement: "°C"
    min_value: 30
    max_value: 55
    step: 0.5
    initial_value: 45
    optimistic: true
    restore_value: true
    mode: box
    entity_category: config
  - platform: template
    id: mixer_kp
    name: "Mixer gain"
    unit_of_measurement: "%/°C"
    min_value: 0
    max_value: 20
    step: 0.1
    initial_value: 2.5
    optimistic: true
    restore_value: true
    mode: box
    entity_category: config
  - platform: template
    id: mixer_ti
    name: "Mixer integral time"
    unit_of_measurement: "s"
    min_value: 10
    max_value: 1800
    step: 5
    initial_value: 90
    optimistic: true
    restore_value: true
    mode: box
    entity_category: config
  - platform: template
    id: mixer_power
    name: "Mixer drive power"
    unit_of_measurement: "%"
    min_value: 5
    max_value: 100
    step: 1
    initial_value: 30
    optimistic: true
    restore_value: true
    mode: box
    entity_category: config
  # With Mixer auto off, send the valve to this opening (for commissioning and manual running).
  - platform: template
    id: mixer_manual
    name: "Mixer manual opening"
    unit_of_measurement: "%"
    min_value: 0
    max_value: 100
    step: 1
    initial_value: 0
    optimistic: true
    restore_value: false
    mode: box
    set_action:
      - lambda: 'mixer_control::manual_target() = x / 100.0f;'
  - platform: template
    id: mixer_kick
    name: "Mixer kick power"    # first 0.2 s of every move, to break the valve's stiction
    unit_of_measurement: "%"
    min_value: 5
    max_value: 100
    step: 1
    initial_value: 60
    optimistic: true
    restore_value: true
    mode: box
    entity_category: config
  - platform: template
    id: mixer_deadband
    name: "Mixer deadband"
    unit_of_measurement: "%"
    min_value: 0.5
    max_value: 10
    step: 0.5
    initial_value: 3
    optimistic: true
    restore_value: true
    mode: box
    entity_category: config
  - platform: template
    id: mixer_home_time
    name: "Mixer home time"     # cold homing run (pushes gently on the cold stop at the end)
    unit_of_measurement: "s"
    min_value: 2
    max_value: 60
    step: 0.5
    initial_value: 12
    optimistic: true
    restore_value: true
    mode: box
    entity_category: config
  # Positions in servo sensor counts along the stroke (1755 per turn); set by Mixer calibrate.
  - platform: template
    id: mixer_cold_x
    name: "Mixer cold end"
    min_value: -5000
    max_value: 5000
    step: 1
    initial_value: -300
    optimistic: true
    restore_value: true
    mode: box
    entity_category: config
  - platform: template
    id: mixer_stroke_x
    name: "Mixer stroke"        # 0 = not calibrated
    min_value: 0
    max_value: 10000
    step: 1
    initial_value: 0
    optimistic: true
    restore_value: true
    mode: box
    entity_category: config
  - platform: template
    id: mixer_play_x
    name: "Mixer play"          # lever play, in the same counts
    min_value: 0
    max_value: 500
    step: 1
    initial_value: 0
    optimistic: true
    restore_value: true
    mode: box
    entity_category: config
  - platform: template
    id: mixer_coast_x
    name: "Mixer coast"         # how far the shaft runs on after the drive stops
    min_value: 0
    max_value: 300
    step: 1
    initial_value: 50
    optimistic: true
    restore_value: true
    mode: box
    entity_category: config

# ---------------------------------------------------------------- Temperatures (DS18B20 on GPIO21)
# Three probes at the mixer's ports. Addresses are printed in the log at boot. To find which is which,
# warm one probe by hand and watch which reading rises.
sensor:
  - platform: dallas_temp
    id: temp_boiler_flow
    name: "Boiler flow temperature"
    address: 0x120316815910ff28
    update_interval: 10s
  - platform: dallas_temp
    id: temp_return
    name: "Return temperature"
    address: 0xa404168156b6ff28
    update_interval: 10s
  - platform: dallas_temp
    id: temp_mixed_flow
    name: "Mixed flow temperature"
    address: 0x6a0416815ad7ff28
    update_interval: 5s   # the controlled value: read as often as the control loop runs
  - platform: template
    id: mixer_opening
    name: "Mixer opening"
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: never   # published by the control loop

  - platform: uptime
    name: "Uptime"

# ---------------------------------------------------------------- Indicators
output:
  - platform: ledc
    id: buzzer_out
    pin: GPIO46

rtttl:
  output: buzzer_out

light:
  - platform: esp32_rmt_led_strip
    id: status_rgb
    name: "Status LED"
    pin: GPIO38
    num_leds: 1
    chipset: WS2812
    channel_colors: RGB  # GRB swapped red and green on this board
    restore_mode: ALWAYS_OFF

# ---------------------------------------------------------------- LCD (Waveshare 2.4" ILI9341, 240x320)
# CS tied to GND, BL tied to 3V3 (see README). RST is on GPIO0 (the BOOT pin, high at power-on, so
# safe to share): with CS tied low the panel can't resync on its own, so it needs a hardware reset
# after the SPI pins are set up.
# Sizes must match FONT_FILES in tools/screen_preview/render.py.
font:
  - file: "fonts/DejaVuSans-Bold.ttf"
    id: font_pct
    size: 22
  - file: "fonts/DejaVuSans-Bold.ttf"
    id: font_temp
    size: 20
  - file: "fonts/DejaVuSans.ttf"
    id: font_label
    size: 13
  - file: "fonts/DejaVuSans.ttf"
    id: font_small
    size: 12

display:
  - platform: mipi_spi
    id: lcd
    model: ILI9341
    spi_id: lcd_spi
    dc_pin: GPIO3
    reset_pin: GPIO0
    data_rate: 10MHz
    spi_mode: MODE0
    rotation: 90
    # Redrawn by the interval below: fast while a pump runs (to animate the flow), slow otherwise.
    update_interval: never
    # Relays: 1 boiler CFH + pump, 2 floor pump, 4-8 zone valves.
    # DI1-4: room thermostats.
    lambda: |-
      auto t = [](sensor::Sensor *s) { return s->has_state() ? s->state : NAN; };
      ufh_screen::State st;
      st.boiler = t(id(temp_boiler_flow));
      st.mixed = t(id(temp_mixed_flow));
      st.ret = t(id(temp_return));
      auto &pz = mixer_control::positioner();
      if (id(mixer_servo).is_online() && pz.known()) st.mixer_pct = pz.opening(mixer_control::pos_config()) * 100;
      st.boiler_on = id(relay1).state;
      st.floor_pump_on = id(relay2).state;
      // Zone valves on relays 4-8; which dot is which room is provisional until the zones are mapped.
      switch_::Switch *zones[5] = {id(relay4), id(relay5), id(relay6), id(relay7), id(relay8)};
      for (int i = 0; i < 5; i++) st.zone[i] = zones[i]->state;
      // DI1-4: thermostats in Playroom, Kitchen, Booth, Lounge (on = calling for heat)
      binary_sensor::BinarySensor *stats[4] = {id(di1), id(di2), id(di3), id(di4)};
      for (int i = 0; i < 4; i++) st.room_calling[i] = stats[i]->state;
      // Relays are still switched by hand; the mixer may be automatic.
      st.mode = id(mixer_auto).state ? "AUTO" : "MANUAL";
      const std::string &hs = id(heating_status).state;
      if (!hs.empty() && hs != "Idle") st.status = hs.c_str();
      else if (!id(mixer_servo).is_online()) st.status = "Mixer offline";
      else if (st.boiler_on) st.status = "Heating";
      else if (st.floor_pump_on) st.status = "Circulating";
      else st.status = "Idle";
      st.ms = millis();
      ufh_screen::draw(it, st, id(font_pct), id(font_temp), id(font_label), id(font_small));

interval:
  - interval: 200ms
    then:
      - lambda: |-
          static uint8_t ticks = 0;
          if (id(relay1).state || id(relay2).state || ++ticks >= 10) {
            ticks = 0;
            id(lcd).update();
          }

  # Mixed-flow control and over-temperature cut-out (mixer_control.h). The positioner runs every
  # second (servo moves are timed runs); the controller every 5 s.
  - interval: 1s
    then:
      - lambda: |-
          static uint8_t tick = 0;
          static uint32_t last_ms = millis();
          static bool moving = false, pump_was_on = false;
          auto &c = mixer_control::instance();
          auto &pz = mixer_control::positioner();
          auto *sv = id(mixer_servo);
          const bool automatic = id(mixer_auto).state, pump_on = id(relay2).state;

          // --- Controller, every 5 s ---
          if (++tick >= 5) {
            tick = 0;
            auto t = [](sensor::Sensor *s) { return s->has_state() ? s->state : NAN; };
            mixer_control::Inputs in;
            in.boiler = t(id(temp_boiler_flow));
            in.mixed = t(id(temp_mixed_flow));
            in.ret = t(id(temp_return));
            in.pump_on = pump_on;
            in.automatic = automatic && pz.known();
            in.dt = (millis() - last_ms) / 1000.0f;
            last_ms = millis();
            mixer_control::Settings cfg;
            cfg.setpoint = id(mixed_setpoint).state;
            cfg.limit = id(mixed_limit).state;
            cfg.kp = id(mixer_kp).state;
            cfg.ti = id(mixer_ti).state;
            c.update(in, cfg);

            // Over-temperature (or no mixed reading for 30 s): CFH off, and kept off until it clears.
            if (c.over_temp() && id(relay1).state) {
              ESP_LOGW("mixer", "Mixed flow %.1f °C over limit %.1f °C (or no reading): boiler CFH off",
                       in.mixed, cfg.limit);
              id(relay1).turn_off();
            }
          }

          // --- Positioner ---
          auto &pc = mixer_control::pos_config();
          pc.cold_x = id(mixer_cold_x).state;
          pc.stroke_x = id(mixer_stroke_x).state;
          pc.play_x = id(mixer_play_x).state;
          pc.coast_x = id(mixer_coast_x).state;
          pc.deadband = id(mixer_deadband).state / 100;
          pc.home_s = id(mixer_home_time).state;
          auto &mv = mixer_control::current_move();
          // Find the valve again when auto starts the pump, or if the position was lost.
          if (automatic && pump_on && !pump_was_on) pz.request_home();
          if (automatic && !pz.known() && pz.mode() == mixer_control::PosMode::IDLE && pc.stroke_x > 0) pz.request_home();
          pump_was_on = pump_on;

          static int exits_seen = 0;
          if (pz.tracker().gap_exits() != exits_seen) {
            exits_seen = pz.tracker().gap_exits();
            ESP_LOGD("mixer", "Left the sensor gap: estimate was %.0f counts out", pz.tracker().last_exit_error());
          }

          if (moving && !sv->is_running()) {
            moving = false;
            mixer_control::move_active() = false;
            const auto &r = sv->last_run();
            if (r.failed) {
              pz.lost();
            } else {
              pz.done(mv, r.stopped && pz.stopped_on_stall(), sv->last_position(), &pc);
              if (pz.take_calibrated()) {
                ESP_LOGI("mixer", "Calibrated: cold end %.0f, stroke %.0f counts", pc.cold_x, pc.stroke_x);
                auto c1 = id(mixer_cold_x).make_call(); c1.set_value(pc.cold_x); c1.perform();
                auto c2 = id(mixer_stroke_x).make_call(); c2.set_value(pc.stroke_x); c2.perform();
              }
              if (pz.cal_failed()) ESP_LOGW("mixer", "Calibration failed: no stall seen at the hot end");
            }
          }
          if (!sv->is_online()) {
            if (sv->is_running()) sv->stop_run();
            pz.lost();
          } else if (!moving && !sv->is_running()) {
            // Control moves in auto (over-temp drives the target to cold); manual target otherwise.
            const bool manual = !automatic && !std::isnan(mixer_control::manual_target());
            const bool control = (automatic && (c.over_temp() || pump_on)) || manual;
            const float target = automatic ? c.opening() : mixer_control::manual_target();
            if (pz.next(target, control, pc, &mv)) {
              const int power = int(id(mixer_power).state * 10) * (id(mixer_reverse).state ? -1 : 1);
              const int kick = int(id(mixer_kick).state * 10) * (id(mixer_reverse).state ? -1 : 1);
              mixer_control::move_active() = true;
              moving = sv->start_run(mv.dir * power, uint32_t(mv.max_s * 1000), mv.dir * kick, 200);
              if (!moving) mixer_control::move_active() = false;
            }
          }

          // --- Reporting ---
          if (pz.known() && pc.stroke_x > 0) {
            float pct = pz.opening(pc) * 100;
            if (!id(mixer_opening).has_state() || std::fabs(id(mixer_opening).state - pct) >= 1)
              id(mixer_opening).publish_state(pct);
          }
          const char *st = mixer_control::status_text(c.status());
          switch (pz.mode()) {
            case mixer_control::PosMode::HOMING: st = "Homing"; break;
            case mixer_control::PosMode::CAL_HOME:
            case mixer_control::PosMode::CAL_MEASURE:
            case mixer_control::PosMode::CAL_RETURN: st = "Calibrating"; break;
            default:
              if (pz.cal_failed()) st = "Cal failed";
              else if (automatic && pc.stroke_x <= 0) st = "Not calibrated";
          }
          if (c.over_temp()) st = "Over-temp";
          if (id(heating_status).state != st) id(heating_status).publish_state(st);

text_sensor:
  - platform: template
    id: heating_status
    name: "Heating status"
    update_interval: never
