name: Build firmware

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dummy secrets for CI
        run: |
          python3 - <<'PY'
          import base64, secrets
          open("secrets.yaml", "w").write(
              f'api_encryption_key: "{base64.b64encode(secrets.token_bytes(32)).decode()}"\n'
              'web_password: "ci-only"\n'
          )
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install ESPHome
        run: pip install esphome
      - name: Compile
        run: esphome compile ufh-controller.yaml
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: ufh-controller-firmware
          path: .esphome/build/ufh-controller/**/firmware*.bin
          if-no-files-found: warn
